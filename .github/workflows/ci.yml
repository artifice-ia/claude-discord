name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Bun caches its downloaded binary + install cache per-runner; concurrency
# cancels stale runs on the same ref so a fresh push preempts an in-flight one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bun test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version we've been running locally + on the fleet.
          # Bump deliberately in this file rather than tracking `latest` — a
          # transparent-to-devs bump is how a CI-only regression sneaks in.
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Uses the project's own tsconfig.json (added alongside this workflow).
      # `--noEmit` is critical — this is a type-only gate, not a compile step
      # that races with `bun` at runtime. The @artifice-ia/fleet-bus package
      # ships .ts sources and its types flow through the same TypeScript pass.
      - name: Typecheck
        run: bunx tsc --noEmit
